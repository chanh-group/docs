info:
  name: List Messages
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/conversations/:id/messages?limit={{message_limit}}"
  params:
    - name: id
      value: "{{conversation_id}}"
      type: path
    - name: limit
      value: "{{message_limit}}"
      type: query
      description: Defaults to 30 when omitted
    - name: cursor
      value: "{{message_cursor}}"
      type: query
      description: Optional backward-pagination cursor
      disabled: true
    - name: after
      value: "{{message_after}}"
      type: query
      description: Optional forward-pagination cursor
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
