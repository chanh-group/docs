info:
  name: Send Message
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/conversations/:id/messages"
  params:
    - name: id
      value: "{{conversation_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "body": "Hello from Bruno",
        "kind": "TEXT"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: message_id
        scope: runtime
      description: Reuse the message id in edit, revoke, and mark-read requests

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
