info:
  name: Change Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/auth/change-password"
  body:
    type: json
    data: |-
      {
        "oldPassword": "{{password}}",
        "newPassword": "{{new_password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
