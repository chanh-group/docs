info:
  name: Story Viewers
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/stories/:id/views"
  params:
    - name: id
      value: "{{story_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
