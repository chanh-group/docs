info:
  name: Get Story By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/stories/:id"
  params:
    - name: id
      value: "{{story_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
