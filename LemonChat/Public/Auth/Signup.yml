info:
  name: Signup
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/auth/signup"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "fullName": "{{full_name}}",
        "username": "{{username}}",
        "password": "{{password}}",
        "otp": "{{otp}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
