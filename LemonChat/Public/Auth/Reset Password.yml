info:
  name: Reset Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/api/auth/forgot-password/reset"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "otp": "{{otp}}",
        "newPassword": "{{new_password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
