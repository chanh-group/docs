info:
  name: Forgot Password OTP
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/auth/forgot-password/otp"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
